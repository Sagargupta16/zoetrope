name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Repo gate (dashes, secrets, home paths, frontmatter, links, JSON, manifests, line ends)
        run: uv run --no-project python scripts/check.py

  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core
          # ffmpeg 9.0, as on the author's machine: Ubuntu's older ffmpeg AAC encode overshoots the true peak more,
          # the master ceiling drops to -2.9 dBTP and the template's limiter gate (Q805) fails
          # pinned to one dated autobuild and checked against the sha256 that release publishes (not the moving `latest`);
          # a month's last build, which BtbN keeps for two years (daily builds go after 14 days)
          FF_TAG=autobuild-2026-10-31-12-59
          FF_FILE=ffmpeg-n9.0.2-39-g7adfbe40dc-linux64-gpl-9.0.tar.xz
          echo "73e29a56974ae5a651133a04584c7483b21afe941e17dc91d79814a758b608d3  $FF_FILE" > /tmp/ff.sha256
          curl -fsSL --proto '=https' -o "/tmp/$FF_FILE" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FF_TAG/$FF_FILE"
          (cd /tmp && sha256sum -c ff.sha256)
          mkdir -p /tmp/ff
          tar -xJf "/tmp/$FF_FILE" -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1

      - name: Engine self test on a fresh copy (planted faults, then the template at 16:9 and 9:16)
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          cp -r skills/zoetrope/engine/. "$RUNNER_TEMP/selftest/"
          cd "$RUNNER_TEMP/selftest"
          # the folder's .venv, each wheel checked against its sha256 in requirements.txt; the next line runs in it
          uv run --no-project python envs.py
          uv run --no-project --with-requirements requirements.txt python qa.py selftest

      - name: Show the template QA findings on failure
        if: failure()
        run: |
          for f in /tmp/zoetrope_selftest_*/template_*/full.log; do echo "== $f"; grep -E "FIX|NOTE|NOT CHECKED|QA:" "$f" | tail -20; done
