name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Repo gate (dashes, secrets, home paths, frontmatter, links, JSON, manifests, line ends)
        run: uv run --no-project python scripts/check.py

  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core

      - name: Engine self test on a fresh copy (planted faults, then the template at 16:9 and 9:16)
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          cp -r skills/zoetrope/engine/. "$RUNNER_TEMP/selftest/"
          cd "$RUNNER_TEMP/selftest"
          uv run --no-project --with-requirements requirements.txt python qa.py selftest
