<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stage</title>
<link rel="stylesheet" href="/studio/stage.css">
<link rel="stylesheet" href="/studio/kit.css">
<link rel="stylesheet" href="/studio/kit_graphics.css">
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="blur-x" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="blur-x-fe" stdDeviation="0 0"/></filter>
</svg>
<script src="/studio/runtime.js"></script>
<script src="/studio/kit.js"></script>
<script src="/studio/kit_graphics.js"></script>
<script>
  // ?video=builds/01-slug loads that folder's timeline.json (and graphics.js when the timeline asks
  // for it); a folder with only a hand-written video.js (the spike) loads that instead.
  const load = src => new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = () => fail(new Error('could not load ' + src));
    document.body.appendChild(s);
  });
  (async () => {
    try {
      const video = new URLSearchParams(location.search).get('video');
      const res = await fetch('/' + video + '/timeline.json', { cache: 'no-store' });
      if (res.ok) {
        const timeline = await res.json();
        if (timeline.graphics) await load('/' + video + '/graphics.js');
        Kit.mount(timeline, '/' + video + '/');
      } else {
        await load('/' + video + '/video.js');
      }
      await Stage.boot();
    } catch (e) {
      window.__error = String((e && e.message) || e);
    }
  })();
</script>
</body>
</html>
